<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a7f5a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Resistencia 10k → 16k → 21k y fuerza en casa" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Entreno – 10k · 16k · 21k</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-row">
      <div>
        <h1>Entreno</h1>
        <div class="sub" id="header-sub">10k · 16k · 21k · fuerza en casa</div>
      </div>
      <button class="header-btn" data-view="settings" aria-label="Ajustes">⚙️</button>
    </div>
    <div class="phase-pill" id="phase-pill">Base</div>
  </header>

  <main class="main">
    <section class="view active" id="view-today" aria-label="Hoy">
      <div id="today-content"></div>
    </section>

    <section class="view" id="view-week" aria-label="Semana">
      <div class="week-nav">
        <button class="btn sm" id="week-prev" aria-label="Semana anterior">←</button>
        <div style="text-align:center;flex:1">
          <h2 id="week-label">Semana</h2>
          <button class="btn sm ghost" id="week-today">Esta semana</button>
        </div>
        <button class="btn sm" id="week-next" aria-label="Semana siguiente">→</button>
      </div>
      <div class="week-list" id="week-list"></div>
    </section>

    <section class="view" id="view-progress" aria-label="Progreso">
      <div id="progress-content"></div>
    </section>

    <section class="view" id="view-exercises" aria-label="Ejercicios">
      <div id="exercises-content"></div>
    </section>

    <section class="view" id="view-settings" aria-label="Ajustes">
      <div id="settings-content"></div>
    </section>
  </main>

  <nav class="nav" aria-label="Navegación principal">
    <button data-view="today" class="active"><span class="ico">☀️</span>Hoy</button>
    <button data-view="week"><span class="ico">📅</span>Semana</button>
    <button data-view="exercises"><span class="ico">💪</span>Ejercicios</button>
    <button data-view="progress"><span class="ico">📈</span>Progreso</button>
  </nav>

  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal" id="modal"></div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="plan.js"></script>
  <script src="exercises.js"></script>
  <script src="garmin.js"></script>
  <script src="progress.js"></script>
  <script src="app.js"></script>
</body>
</html>
